[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred-date-calculator"
version = "3.0.0"
description = "Date calculator Alfred workflow — modernised for Alfred 5.x"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.9",
    "arrow>=1.3",
    "pypeg2>=2.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "freezegun>=1.5",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -v"
